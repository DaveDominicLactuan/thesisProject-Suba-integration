<!-- Background image and overlay -->
<div class="page-bg" aria-hidden="true">
  <!-- <img src="assets/BackgroundImage1.png" alt="Background" /> -->
   <img src="assets/backgroundImage2.png" alt="Background" /> 
  <div class="overlay"></div>
  <!-- pointer-events disabled via CSS so UI remains clickable -->
</div>

<div class="background scrollable-container">

  <!-- actual content starts here -->
  <div class="logo">
    <img src="assets/thesisIcon1.png" alt="D.A.M.A.G.E. Logo">
  </div>

  
<div class="login-form">
  <button class="back-btn" type="button" (click)="onBack()">
    <img src="assets/back.png" alt="Back" class="back-icon" />
  </button>
  
  <!-- Spinner overlay during login -->
  <div *ngIf="isLoggingIn" class="spinner-container-circle">
    <svg class="circle-spinner" width="100" height="100" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="spinnerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#ff512f;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#f09819;stop-opacity:1" />
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="45" class="circle-spinner-path" />
    </svg>
  </div>

  <h2 class="login-title">Welcome back Engineer!</h2>
  <p class="login-subtitle">
    Hello, you must login first to be able to use the application and enjoy all the features in Calashop
  </p>


  <!-- Email -->
  <div class="form-group">
    <label for="email">Email Address</label>
    <div class="input-item">
      <span class="icon"><i class="fa fa-envelope"></i></span>
      <input id="email" type="email" placeholder="Email Address" [(ngModel)]="email" name="email" />
    </div>
  </div>



  <!-- Password -->
  <div class="form-group">
    <label for="password">Password</label>
    <div class="input-item">
      <span class="icon"><i class="fa fa-lock"></i></span>
      <input
        id="password"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password"
        [(ngModel)]="password"
        name="password" />
      <span class="icon toggle" (click)="togglePasswordVisibility()">
        <i [class]="showPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
      </span>
    </div>
  </div>

  <!-- Options -->
  <div class="options">
    <label class="remember-me">
      <input type="checkbox" [(ngModel)]="rememberMe" />
      Remember me
    </label>
    <a class="forgot-password" href="#">Forgot Password?</a>
  </div>

  <button class="sign-in-button" (click)="login()">Sign in</button>

  <!-- Spinner toggle button for testing/styling -->
  <!-- <button class="spinner-toggle-button" (click)="toggleSpinner()">
    {{ isLoggingIn ? 'Stop Spinner' : 'Test Spinner' }}
  </button> -->
  <!-- <button class="sign-in-button" (click)="goToHomePage()">HomePage</button>
  <button class="sign-in-button" (click)="goToHomePage2()">HomePage2</button> -->
</div>





</div>
