 <div class="quick-actions" aria-label="Quick actions">
    <div class="qa-card" (click)="goToCameraPage2()">
      <div class="qa-icon qa-icon-tv" aria-hidden="true">
        <img src="assets/updatedCameraIcon.png" alt="Mirror Screen" />
      </div>
      <div class="qa-text">
        <div class="qa-title">Start New Session</div>
        <div class="qa-subtitle">Start taking pictures</div>
      </div>
      <ion-icon class="qa-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
    </div>

    <div class="qa-card" (click)="goToUploadImage()">
      <div class="qa-icon qa-icon-receiver" aria-hidden="true">
        <img src="assets/updatedUploadImageIcon.png" alt="Screen Receiver" />
      </div>
      <div class="qa-text">
        <div class="qa-title">Upload Images</div>
        <div class="qa-subtitle">Upload images to session</div>
      </div>
      <ion-icon class="qa-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
    </div>

      </div>
    </div>
  </div>
