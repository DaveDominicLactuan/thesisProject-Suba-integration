<!-- 📸 Live Camera Preview Container -->
<div class="camera-live">
    <!-- 🎥 Live Camera Feed -->
  <video #video autoplay muted playsinline class="camera-feed"></video>

  <!-- Brief visual flash when taking a picture -->
  <div *ngIf="showFlash" class="capture-flash"></div>


  <!-- 🎨 Hidden Canvas for Capturing -->
  <canvas #canvas hidden></canvas>

  <!-- Horizontal level guide (white when off-level, green when level) -->
  <div *ngIf="isLevelEnabled" class="level-guide-overlay">
    <div
      class="level-line"
      [class.level-ok]="isPhoneLeveled"
      [style.transform]="'translate(-50%, -50%) rotate(' + (-levelRollDeg) + 'deg)'"
    ></div>
  </div>


  <!-- Process Window Modal -->
  <div *ngIf="isProcessWindowOpen" class="process-window-backdrop" (click)="closeProcessWindow()">
    <div class="process-window-modal" (click)="$event.stopPropagation()">
      <div class="process-window-header">
        <h2>Process Window</h2>
      </div>
      <div class="process-window-content">
        <div class="process-section-title">Photos</div>
        <div class="process-info-row">
          <span class="process-label">Photos Taken</span>
          <span class="process-value">{{ photosTaken }}</span>
        </div>
        <div class="process-info-row">
          <span class="process-label">Photos Processed</span>
          <span class="process-value">{{ photosProcessed }}</span>
        </div>
        <div class="process-info-row">
          <span class="process-label">Cracks Detected in Image</span>
          <span class="process-value">{{ totalBoundingBoxesCreated }}</span>
        </div>
        <!-- <div class="process-notice">
          <p><strong>Notice:</strong></p>
          <p>The total number of photos taken shows the full number of images does not always equal the total cracks detected in image</p>
        </div> -->
      </div>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
      <!-- <button class="top-btn left" (click)="goToHomePage()">←</button> -->
      <!-- <div class="top-center">
        <button class="top-btn" (click)="toggleFlash()"></button>
      </div>
      <button class="top-btn right" (click)="showTestOverlay()">⋮</button> -->
    </div>

    <div class="top-spinner-overlay">
      <div class="spinner-container-rect large-spinner">
        <svg *ngIf="photosProcessed < photosTaken" class="rect-spinner" width="345" height="635">
          <rect x="10" y="10" width="325" height="615" rx="60" ry="60" class="rect-spinner-path" />
        </svg>
      </div>
    </div>

  <!-- 🔽 Bottom Bar -->
  <div class="bottom-bar">
    <!-- Top Section (Buttons + Face Detection) -->
      <div class="bottom-top-row">
  <!-- <button class="function-btn" (click)="pickImagesMobile()">Upload Image <img src="assets/Upload_Image_White.png" alt="Upload" class="action-icon" /></button>
      <button class="function-btn" (click)="goToFeedBackPage()">Finish Session <img src="assets/check2.png" alt="Finish" class="action-icon" /></button> -->
      <button class="function-btn" (click)="pickImagesMobile()">
        <img src="assets/Upload_Image_White.png" alt="Upload" class="action-icon" />
      </button>

      <button
        class="function-btn toggle-btn"
        [class.toggle-on]="isFlashEnabled"
        (click)="toggleFlash()"
      >
        <img src="assets/pngwing.com.png" alt="Flash" class="action-icon" />
      </button>

      <button
        class="function-btn toggle-btn"
        [class.level-on]="isLevelEnabled && isPhoneLeveled"
        [class.level-off]="isLevelEnabled && !isPhoneLeveled"
        (click)="toggleLevelGuide()"
      >
        <img src="assets/levelIcon.png" alt="Level" class="action-icon" />
      </button>
<!-- 
       <button class="function-btn" (click)="showTestOverlay()">
        <img src="assets/Session-White.png" alt="Finish" class="action-icon" />
      </button> -->

      <button class="function-btn" (click)="goToFeedBackPage()">
        <img src="assets/check2.png" alt="Finish" class="action-icon" />
      </button>
    </div>


    <!-- Bottom Section (Spinner + Shutter + Thumbnails) -->
    <div class="bottom-bottom-row">
      <div class="func-action" (click)="openProcessWindow()">
        <div class="spinner-container-rect" [class.has-processed-images]="processedGlowActive">
          <svg *ngIf="photosProcessed < photosTaken" class="rect-spinner" width="70" height="40">
            <rect x="2" y="2" width="66" height="36" rx="12" ry="12" class="rect-spinner-path" />
          </svg>
          <div class="center-value-rect">{{ photosProcessed }}/{{ photosTaken }}</div>
          <div class="red-circle" [ngClass]="{ 'green': photosProcessed === photosTaken, 'red': photosProcessed < photosTaken }"></div>
        </div>
        <!-- <div class="action-label">Images Processed</div> -->
      </div>

      <!-- 🔘 Capture Button -->
      <button
        class="shutter-btn"
        [class.shutter-btn-green]="isLevelEnabled && isPhoneLeveled"
        (click)="takePicture()"
        [disabled]="isCooldown"
      ></button>

      <!-- Thumbnails on the right (render from stored images) -->
      <div *ngIf="storedImages.length === 0" class="thumbnail-placeholder" (click)="openTestOverlay()"></div>
      <div *ngIf="storedImages.length > 0" class="thumbnail-scroll" (click)="openTestOverlay()">
        <img *ngFor="let img of storedImages"
             [src]="img.original"
             class="thumbnail"
             [class.selected]="getImageSelectionKey(img) === selectedImageKey"
             (click)="$event.stopPropagation(); onStoredThumbClick(img); openTestOverlay()"
             [title]="img.filename || img.timestamp"
        />
      </div>

  
    </div>
  </div>
</div>

<!-- Back button at the top left corner -->
<div class="back-button-container">
  <button class="back-btn" type="button" (click)="goToHomePage()">
    <img src="assets/back.png" alt="Back" class="back-icon" />
  </button>
</div>
