<!-- Image above gradient header -->
<img src="assets/sessionPageImage.png" alt="Home Page" class="home-page-img" />

<!-- Orange gradient header -->
<div class="gradient-header"></div>
<div class="background-white"></div>

<!-- Backdrop to close sidebar when clicking outside -->
<div
  *ngIf="isSidebarOpen"
  class="sidebar-backdrop"
  (click)="closeSidebar()"
></div>

<div class="custom-sidebar" [ngClass]="{'open': isSidebarOpen}" (click)="$event.stopPropagation()">
  <div class="profile-section">
    <div class="profile-avatar" style="cursor: pointer;">
      <img src="assets/engIcon.png" alt="Profile" />
    </div>
    <div class="profile-info">
      <h1 class="profile-name">{{ firstName }} {{ lastName }}</h1>
      <p class="profile-email">{{ email }}</p>
    </div>
  </div>
  <ul class="menu-items">
    <div class="menu-section">
      <li class="menu-item">
        <ion-icon name="checkmark-circle"></ion-icon>
        <span>Availability</span>
      </li>
      <li class="menu-item">
        <ion-icon name="create-outline"></ion-icon>
        <span>Set Status Message</span>
      </li>
      <li class="menu-item">
        <ion-icon name="notifications-outline"></ion-icon>
        <span>Notifications</span>
      </li>
       <li class="menu-item" (click)="goToHomePage()">
        <ion-icon name="home-outline"></ion-icon>
        <span>Home</span>
      </li>
      <li class="menu-item" (click)="goSessionPage()">
        <ion-icon name="bookmark-outline"></ion-icon>
        <span>Show Current Sessions</span>
      </li>
    </div>
    <hr class="menu-divider" />
    <div class="menu-section">  
      <li class="menu-item">
        <ion-icon name="folder-outline"></ion-icon>
        <span>Files</span>
      </li>
      <li class="menu-item">
        <ion-icon name="settings-outline"></ion-icon>
        <span>Settings</span>
      </li>
    </div>
    <hr class="menu-divider" />
    <div class="menu-section">
      <li class="menu-item">
        <ion-icon name="person-outline"></ion-icon>
        <span>About Us</span>
      </li>
      <li class="menu-item">
        <ion-icon name="help-circle-outline"></ion-icon>
        <span>Help</span>
      </li>
      <li class="menu-item" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Log Out</span>
      </li>
    </div>
  </ul>
</div>

<div class="menu-btn unique-menu top-left-corner" (click)="openMenu('sidebarMenu')">
  <img src="assets/moreIcon.png" alt="Menu" class="big-icon1" />
</div>



<!-- Profile Edit Card -->
<div class="profile-edit-card">
  <!-- Profile Picture Section -->
  <div class="profile-pic-section">
    <div class="profile-picture-container">
      <img [src]="profilePicture || 'assets/engIcon.png'" alt="Profile Picture" class="profile-pic" />
    </div>
    <div class="change-picture-text">Change Picture</div>
    <button *ngIf="!isEditing" class="edit-btn" (click)="onEditProfile()">Edit</button>
  </div>

  <!-- Profile Form -->
  <form class="profile-form">
    <div class="form-group">
      <label class="form-label">Username</label>
      <input 
        type="text" 
        class="form-input" 
        [(ngModel)]="userName" 
        name="username"
        placeholder="Enter username"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Email I'd</label>
      <input 
        type="email" 
        class="form-input" 
        [(ngModel)]="email" 
        name="email"
        placeholder="Enter email"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input 
        type="tel" 
        class="form-input" 
        [(ngModel)]="phoneNumber" 
        name="phoneNumber"
        placeholder="Enter phone number"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input 
        type="password" 
        class="form-input" 
        [(ngModel)]="password" 
        name="password"
        placeholder="Enter password"
      />
    </div>

    <button type="button" class="update-btn" (click)="onUpdateProfile()">Update</button>
  </form>
</div>

<ion-content id="main-content" class="home-page" (click)="closeSidebar()">
 
</ion-content>
