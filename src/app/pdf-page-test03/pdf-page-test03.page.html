<ion-content [fullscreen]="true">
  <!-- <ion-button expand="full" (click)="previewPdf()">Generate & Preview PDF</ion-button> -->
  <!-- Session Loading Modal (Outside ion-content for proper z-index/display on device) -->
  <div *ngIf="showSessionLoadingWindow" class="session-loading-overlay" aria-live="polite" aria-busy="true">
    <div class="session-loading-card">
      <!-- Show spinner only if no error -->
      <div *ngIf="!sessionLoadingHasError" class="session-loading-spinner" aria-hidden="true"></div>
      
      <!-- Error indicator if loading failed -->
      <div *ngIf="sessionLoadingHasError" class="session-loading-error-icon" aria-hidden="true">
        <span style="font-size: 48px; color: #ff3333;">⚠</span>
      </div>
      
      <h2>{{ sessionLoadingMessage }}</h2>
      <p>{{ sessionLoadingDetail }}</p>
      
      <!-- Progress Section (only show if not in error state) -->
      <div class="session-loading-progress" *ngIf="sessionLoadingTotal > 0 && !sessionLoadingHasError">
        <div class="session-loading-progress-track">
          <div
            class="session-loading-progress-fill"
            [style.width.%]="(sessionLoadingCompleted / sessionLoadingTotal) * 100"
          ></div>
        </div>
        <div class="session-loading-progress-text">
          {{ sessionLoadingCompleted }} / {{ sessionLoadingTotal }} images
        </div>
      </div>
    </div>
  </div>

  <!-- PDF Generation Modal -->
  <div *ngIf="showPdfGenerationWindow" class="session-loading-overlay" aria-live="polite" aria-busy="true">
    <div class="session-loading-card">
      <div class="session-loading-spinner" aria-hidden="true"></div>
      <h2>{{ pdfGenerationMessage }}</h2>
      <p>{{ pdfGenerationDetail }}</p>
    </div>
  </div>

  <div #pdfContainer style="display: flex; flex-direction: column; justify-content: flex-start; align-items: center; width: 100%; margin-top: 0; padding-top: 0;"></div>

  <div class="bottom-actions">
    <!-- Upload and Finish blocks (now siblings of the spinner block for even spacing) -->
    <div class="func-action" (click)="openPDF()">
      <button class="function-btn icon-btn" aria-label="Open PDF">
        <img src="assets/updatedOpenPDF.png" class="action-icon" />
      </button>
      <div class="action-label">Open</div>
    </div>

    <div class="func-action" (click)="previewPdf()">
      <button class="function-btn icon-btn" aria-label="Preview PDF">
          <img src="assets/updatedPreviewDownload.png" class="action-icon" />
        </button>
      <div class="action-label">Generate & Preview</div>
    </div>

    <div class="func-action" (click)="downloadPDF()">
      <button class="function-btn icon-btn" aria-label="Download PDF">
        <img src="assets/updatedDownloadPDF.png" class="action-icon" />
      </button>
      <div class="action-label">Download</div>
    </div>
  </div>

   <div class="back-button-container">
      <button class="back-btn" type="button" (click)="onBack()">
        <img src="assets/back.png" alt="Back" class="back-icon" />
      </button>
    </div>
    
</ion-content>
