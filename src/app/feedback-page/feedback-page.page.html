<!-- Background image and overlay -->
<div class="page-bg" aria-hidden="true">
  <img src="assets/resultImage2.png" alt="Background" />
  <div class="overlay"></div>
  <!-- pointer-events disabled via CSS so UI remains clickable -->
</div>

<!-- S3 Loading Modal (Outside ion-content for proper z-index/display on device) -->
<div *ngIf="showSessionLoadingWindow" class="session-loading-overlay" aria-live="polite" aria-busy="true">
  <div class="session-loading-card">
    <div class="session-loading-spinner" aria-hidden="true"></div>
    <h2>{{ sessionLoadingMessage }}</h2>
    <p>{{ sessionLoadingDetail }}</p>
    <div class="session-loading-progress" *ngIf="sessionLoadingTotal > 0">
      <div class="session-loading-progress-track">
        <div
          class="session-loading-progress-fill"
          [style.width.%]="(sessionLoadingCompleted / sessionLoadingTotal) * 100"
        ></div>
      </div>
      <div class="session-loading-progress-text">
        {{ sessionLoadingCompleted }} / {{ sessionLoadingTotal }} images
      </div>
    </div>
  </div>
</div>

<div class="background">
  <ion-content class="ion-padding">

    <!-- Back button at the top left corner -->
    <div class="back-button-container">
      <button class="back-btn" type="button" (pointerdown)="handleBackTap($event)" (click)="handleBackTap($event)">
        <img src="assets/back.png" alt="Back" class="back-icon" />
      </button>
    </div>

    <!-- Confirm button at the top left corner -->
<div class="back-button-container2">
  <button class="back-btn2" type="button" (click)="saveCurrentStoredImageAndGoHome()">
    <img src="assets/Check_Black.png" alt="Back" class="back-icon" />
  </button>
</div>

    <div class="page-body">
      <!-- Scrollable image gallery with margin-top -->
      <div class="scroll-wrapper">
        <div class="image-scroll" #scrollContainer (scroll)="onScroll($event)" [ngClass]="getScrollClasses(imagePaths.length)">
          <img
            *ngFor="let img of imagePaths"
            [src]="showWithBoxes ? img.withBoxes : img.original"
            [class.selected]="(showWithBoxes ? img.withBoxes : img.original) === selectedImage"
            (click)="onImageClick(img)"
            (dblclick)="openZoomModal(showWithBoxes ? img.withBoxes : img.original)"
            class="image-item"
          />
        </div>
      </div>

      <!-- Zoom Modal Overlay -->
      <div *ngIf="showZoomModal" class="zoom-overlay" (click)="onZoomOverlayClick($event)">
        <div class="zoom-modal">
          <!-- Close Button -->
          <button class="zoom-close-btn" (click)="closeZoomModal()">
            <span class="close-icon">&times;</span>
          </button>
          
          <!-- Zoom Controls -->
          <div class="zoom-controls">
            <button class="zoom-btn" (click)="zoomOut()" title="Zoom out">−</button>
            <span class="zoom-level">{{ currentZoomLevel.toFixed(1) }}x</span>
            <button class="zoom-btn" (click)="zoomIn()" title="Zoom in">+</button>
            <button class="zoom-btn" (click)="resetZoom()" title="Reset zoom">Reset</button>
          </div>
          
          <!-- Zoomed Image with scroll capability -->
          <div class="zoom-image-container">
            <img 
              #zoomImageElement 
              [src]="zoomImageSrc" 
              alt="Zoomed image"
              class="zoom-image"
            />
          </div>
          
          <!-- Instructions -->
          <div class="zoom-instructions">
            Pinch to zoom • Click outside to close
          </div>
        </div>
      </div>

      <!-- Form metadata section -->
      <div class="login-form">
        <!-- Wrapper keeps the title in the same visual position; delete button is placed to its left -->
        <div class="image-title-wrapper">
          <button class="delete-left-btn" type="button" (click)="deleteSelectedImage()" title="Delete selected image">
            <img src="assets/Trash.png" alt="Delete" class="trash-icon" />
          </button>
          <div class="image-title" [title]="selectedImageTitle">{{ getShortImageTitle(selectedImageTitle) }}</div>
          <!-- Toggle control placed beside the title on the right side -->
          <div class="toggle-wrapper">
            <label class="switch">
              <input type="checkbox" [(ngModel)]="showWithBoxes" (change)="detectCenterImage()" />
              <span class="slider round"></span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="dropdown1">Type of Crack</label>
          <select id="dropdown1" [(ngModel)]="dropdown1" (ngModelChange)="updateSelectedImageFromDropdowns()" class="input-item" [disabled]="isUserReadOnly">
            <option *ngFor="let option of dropdownOptionsDirection" [value]="option">{{ option }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dropdown2">Shape</label>
          <select id="dropdown2" [(ngModel)]="dropdown2" (ngModelChange)="updateSelectedImageFromDropdowns()" class="input-item" [disabled]="isUserReadOnly">
            <option *ngFor="let option of dropdownOptionsShape" [value]="option">{{ option }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dropdown3">Severity of Crack</label>
          <select id="dropdown3" [(ngModel)]="dropdown3" (ngModelChange)="updateSelectedImageFromDropdowns()" class="input-item" [disabled]="isUserReadOnly">
            <option *ngFor="let option of dropdownOptionsSeverity" [value]="option">{{ option }}</option>
          </select>
        </div>

        <div class="button-group">
              <button class="sign-in-button" (click)="viewResults()">View Results</button>
              <!-- <button class="sign-in-button" (click)="saveCurrentStoredImageAndGoHome()">Save Session</button> -->
            </div>

        <div class="button-group">
          <button class="sign-in-button debug-button" (click)="testS3Fetch()" title="Check S3 fetch status in console">🔍 Test S3 Fetch</button>
        </div>

      </div>
    </div>
  </ion-content>
</div>
