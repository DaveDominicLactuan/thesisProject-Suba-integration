<!-- Gallery-style layout (uses scroll-wrapper + image-scroll from feedback-page) -->
<div class="background">
  <ion-content class="ion-padding">

    <div class="top-bar">
      <div class="toggle-wrapper">
        <label class="switch">
          <input type="checkbox" [(ngModel)]="showWithBoxes" (change)="detectCenterImage()" />
          <span class="slider round"></span>
        </label>
        <span class="toggle-label">{{ showWithBoxes ? 'With Boxes' : 'Original' }}</span>
      </div>
      <div class="top-title">{{ selectedImageTitle }}</div>
    </div>

    <!-- Scrollable image gallery area -->
    <div class="scroll-wrapper">
      <div class="image-scroll" #scrollContainer (scroll)="onScroll($event)">
        <img
          *ngFor="let img of imagePaths"
          [src]="showWithBoxes ? img.withBoxes : img.original"
          [class.selected]="(showWithBoxes ? img.withBoxes : img.original) === selectedImage"
          (click)="onImageClick(img)"
          class="image-item"
        />

        <!-- Upload prompt when no images yet -->
        <div *ngIf="imagePaths.length === 0 && showUploadPrompt" class="image-item" style="display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-size:20px;height:80vh;gap:12px">
          <div>Please upload images to begin.</div>
          <button class="function-btn" (click)="triggerFileInput()">Upload Image</button>
        </div>

        <!-- fallback placeholder (dev) -->
        <div *ngIf="imagePaths.length === 0 && !showUploadPrompt" class="image-item" style="display:flex;align-items:center;justify-content:center;color:white;font-size:32px;height:80vh">Image-Scroll</div>
      </div>
    </div>

    <!-- Bottom rounded action bar (matches pasted reference) -->
    <div class="bottom-bar">
      <div class="bottom-top-row">
        <div class="spinner-container-rect" (click)="goToFeedBackPage()">
          <svg *ngIf="photosProcessed < photosTaken" class="rect-spinner" width="70" height="40">
            <rect x="2" y="2" width="66" height="36" rx="12" ry="12" class="rect-spinner-path" />
          </svg>
          <div class="center-value-rect">{{ photosProcessed }}/{{ photosTaken }}</div>
          <div class="red-circle" [ngClass]="{ 'green': photosProcessed === photosTaken, 'red': photosProcessed < photosTaken }"></div>
        </div>

        <div class="function-btns" style="display:flex;gap:12px">
          <button class="function-btn" (click)="triggerFileInput()">Upload Image</button>
          <button class="function-btn" (click)="finishSession()">Finish Session</button>
        </div>
      </div>
    </div>

    <!-- hidden file input used for uploads -->
    <input type="file" #fileInput accept="image/*" multiple style="display:none" (change)="onFileSelected($event)" />

  </ion-content>
</div>
